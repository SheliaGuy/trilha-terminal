services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://trilha:trilha@db:5432/trilha
      APP_VERSION: 0.1.0
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trilha
      POSTGRES_PASSWORD: trilha
      POSTGRES_DB: trilha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trilha -d trilha"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
